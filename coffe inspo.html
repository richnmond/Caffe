      function StirCup() {
        const x = useMotionValue(0);

        const tilt = useSpring(useTransform(x, [-150, 150], [-15, 15]), springCfg);
        const swirl = useSpring(useTransform(x, [-150, 150], [-280, 280]), {
          stiffness: 70,
          damping: 18,
        });
        const surfaceShift = useSpring(useTransform(x, [-150, 150], [-9, 9]), springCfg);
        const cremaShift = useSpring(useTransform(x, [-150, 150], [12, -12]), springCfg);

        const [stirred, setStirred] = useState(false);
        const [toast, setToast] = useState(false);
        const timer = useRef(null);

        const onStir = useCallback(() => {
          setStirred(true);
          setToast(true);
          clearTimeout(timer.current);
          timer.current = setTimeout(() => setToast(false), 1500);
        }, []);

        useEffect(() => () => clearTimeout(timer.current), []);

        const bodyPath =

        return (
          <div className="relative mx-auto w-full max-w-[430px]">

              onDragStart={onStir}
              onDrag={onStir}

                    <stop offset="100%" stopColor="#E6D6C1" />
                  </linearGradient>
                  <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#DCC9B1" />
                    <stop offset="100%" stopColor="#EFE3D3" />
                  </linearGradient>

                    <stop offset="0%" stopColor="#7A4A28" />
                    <stop offset="60%" stopColor="#4A2A18" />
                    <stop offset="100%" stopColor="#241209" />
                  </linearGradient>
                  <linearGradient id="crema" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stopColor="#E0B37C" />
                    <stop offset="50%" stopColor="#C08552" />
                    <stop offset="100%" stopColor="#9C6537" />
                  </linearGradient>
                  <clipPath id="cupClip">
                    <path d={bodyPath} />
                  </clipPath>
                </defs>

                <g>
                  {[0, 1, 2].map((i) => (
                    <motion.path
                      key={i}
                      d={`M${136 + i * 24} 106 c -9 -14 9 -22 0 -36 c -9 -14 9 -22 0 -34`}
                      fill="none"
                      stroke="#C08552"
                      strokeWidth="3"
                      strokeLinecap="round"
                      initial={{ opacity: 0 }}
                      animate={{ opacity: [0, 0.42, 0], y: [6, -10, -22] }}
                      transition={{
                        duration: 4.2,
                        repeat: Infinity,
                        delay: i * 0.85,
                        ease: "easeInOut",
                      }}
                    />
                  ))}
                </g>

                <ellipse cx="160" cy="320" rx="120" ry="19" fill="#1B1310" opacity="0.07" />
                <ellipse

                  cy="312"
                  rx="116"
                  ry="19"

                  stroke="#F7EFE4"
                  strokeWidth="16"
                  strokeLinecap="round"

      /* ------------------------------------------------------------------ */
      /*  GALLERY — draggable strip                                          */
      /* ------------------------------------------------------------------ */

      function Gallery() {
        const viewportRef = useRef(null);
        const trackRef = useRef(null);
        const x = useMotionValue(0);
        const [maxDrag, setMaxDrag] = useState(0);
        const [dragging, setDragging] = useState(false);

        useEffect(() => {
          const measure = () => {
            const track = trackRef.current;
            const viewport = viewportRef.current;
            if (!track || !viewport) return;
            setMaxDrag(Math.max(0, track.scrollWidth - viewport.offsetWidth));
          };
          measure();
          const t = setTimeout(measure, 400);
          window.addEventListener("resize", measure);
          return () => {
            window.removeEventListener("resize", measure);
            clearTimeout(t);
          };
        }, []);

        return (
          <section
            id="gallery"
            className="relative scroll-mt-24 overflow-hidden bg-espresso py-24 lg:py-32"
          >
            <div className="pointer-events-none absolute inset-0">

            <div ref={viewportRef} className="relative mt-14 overflow-hidden">
              <motion.div
                ref={trackRef}

                    <div className="aspect-[4/5] overflow-hidden">

                        {loc.address}
                      </p>
                      <p className="mt-5 flex items-center gap-2 text-[13px] text-bark/60">
                        <Clock size={14} className="text-caramel" />
                        {loc.hours}
                      </p>
                      <p className="mt-4 border-t border-espresso/8 pt-4 text-[13.5px] italic leading-relaxed text-bark/55">
                        {loc.note}
                      </p>
                    </div>

                    <a
                      href={loc.maps}
                      target="_blank"
                      rel="noreferrer"
                      className="mt-8 inline-flex items-center gap-2 text-[13px] font-medium tracking-wide text-caramel transition-colors hover:text-espresso"
                    >
                      Get directions
                      <ArrowUpRight
                        size={14}
                        className="transition-transform duration-300 group-hover:-translate-y-0.5 group-hover:translate-x-0.5"
                      />
                    </a>
                  </motion.article>
                ))}
              </div>
            </div>
          </section>
        );
      }

      /* ------------------------------------------------------------------ */
      /*  CONTACT                                                            */
      /* ------------------------------------------------------------------ */

      function Contact() {
        const [copied, setCopied] = useState(false);
        const timer = useRef(null);

        const copyPhone = async () => {
          try {
            await navigator.clipboard.writeText(PHONE);
          } catch {
            const ta = document.createElement("textarea");
            ta.value = PHONE;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
            } catch {}
            document.body.removeChild(ta);
          }
          setCopied(true);
          clearTimeout(timer.current);
          timer.current = setTimeout(() => setCopied(false), 2200);
        };

        useEffect(() => () => clearTimeout(timer.current), []);

        return (
          <section
            id="contact"
            className="relative scroll-mt-24 bg-paper/60 px-6 py-24 sm:px-8 lg:px-12 lg:py-32"
          >
            <div className="mx-auto max-w-7xl">
              <div className="grid gap-14 lg:grid-cols-[1fr_1fr] lg:gap-20">
                <SectionHead
                  eyebrow="Say hello"
                  title="Questions, wholesale, or just a coffee recommendation?"
                  sub="We answer every message ourselves — usually within a day, always before the second cup."
                />

                <motion.div
                  variants={stagger}
                  initial="hidden"
                  whileInView="show"
                  viewport={{ once: true, amount: 0.25 }}
                  className="space-y-4"
                >
                  <motion.div
                    variants={fadeUp}
                    className="flex flex-col gap-4 rounded-[22px] border border-espresso/10 bg-cream p-6 sm:flex-row sm:items-center sm:justify-between sm:p-7"
                  >
                    <div className="flex items-center gap-4">
                      <span className="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-caramel/12 text-caramel">
                        <Phone size={17} />
                      </span>
                      <div>
                        <div className="text-[11px] uppercase tracking-[0.2em] text-bark/50">
                          Call us
                        </div>
                        <a
                          href={PHONE_HREF}
                          className="font-display text-[1.25rem] tracking-[-0.01em] text-espresso transition-colors hover:text-caramel"
                        >
                          {PHONE}
                        </a>
                      </div>
                    </div>

                    <button
                      onClick={copyPhone}
                      aria-label="Copy phone number"
                      className={`inline-flex items-center justify-center gap-2 rounded-full px-5 py-3 text-[12.5px] font-medium tracking-wide transition-all duration-300 ${
                        copied
                          ? "bg-caramel text-cream"
                          : "border border-espresso/15 text-espresso hover:border-espresso/40 hover:bg-espresso/5"
                      }`}
                    >
                      <AnimatePresence mode="wait" initial={false}>
                        {copied ? (
                          <motion.span
                            key="copied"
                            initial={{ opacity: 0, y: 6 }}
                            animate={{ opacity: 1, y: 0 }}
                            exit={{ opacity: 0, y: -6 }}
                            transition={{ duration: 0.2 }}
                            className="inline-flex items-center gap-2"
                          >
                            <Check size={14} /> Copied!
                          </motion.span>
                        ) : (
                          <motion.span
                            key="copy"
                            initial={{ opacity: 0, y: 6 }}
                            animate={{ opacity: 1, y: 0 }}
                            exit={{ opacity: 0, y: -6 }}
                            transition={{ duration: 0.2 }}
                            className="inline-flex items-center gap-2"
                          >
                            <Copy size={14} /> Copy number
                          </motion.span>
                        )}
                      </AnimatePresence>
                    </button>
                  </motion.div>

                  <motion.a
                    variants={fadeUp}
                    href={`mailto:${EMAIL}`}
                    className="group flex items-center justify-between gap-4 rounded-[22px] border border-espresso/10 bg-cream p-6 transition-all duration-300 hover:border-caramel/40 sm:p-7"
                  >
                    <div className="flex items-center gap-4">
                      <span className="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-caramel/12 text-caramel">
                        <Mail size={17} />
                      </span>
                      <div>
                        <div className="text-[11px] uppercase tracking-[0.2em] text-bark/50">
                          Email
                        </div>
                        <div className="font-display text-[1.15rem] tracking-[-0.01em] text-espresso">
                          {EMAIL}
                        </div>
                      </div>
                    </div>
                    <ArrowUpRight
                      size={17}
                      className="shrink-0 text-bark/35 transition-all duration-300 group-hover:-translate-y-0.5 group-hover:translate-x-0.5 group-hover:text-caramel"
                    />
                  </motion.a>

                  <motion.div
                    variants={fadeUp}
                    className="rounded-[22px] border border-espresso/10 bg-cream p-6 sm:p-7"
                  >
                    <div className="flex items-center gap-4">
                      <span className="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-caramel/12 text-caramel">
                        <Clock size={17} />
                      </span>
                      <div className="text-[11px] uppercase tracking-[0.2em] text-bark/50">
                        Roastery hours
                      </div>
                    </div>
                    <dl className="mt-5 space-y-2.5 border-t border-espresso/8 pt-5 text-[13.5px]">
                      {[
                        ["Monday – Friday", "7:00am – 4:00pm"],
                        ["Saturday", "8:00am – 3:00pm"],
                        ["Sunday", "Closed"],
                      ].map(([d, h]) => (
                        <div key={d} className="flex items-center justify-between gap-4">
                          <dt className="text-bark/65">{d}</dt>
                          <dd className="font-medium text-espresso">{h}</dd>
                        </div>
                      ))}
                    </dl>
                  </motion.div>

                  <motion.div variants={fadeUp} className="flex flex-wrap gap-3 pt-2">
                    {[
                      { label: "Instagram", href: "https://instagram.com" },
                      { label: "Wholesale", href: "#contact" },
                      { label: "Careers", href: "#contact" },
                    ].map((s) => (
                      <a
                        key={s.label}
                        href={s.href}
                        target={s.href.startsWith("http") ? "_blank" : undefined}
                        rel="noreferrer"
                        className="inline-flex items-center gap-2 rounded-full border border-espresso/12 px-5 py-2.5 text-[12.5px] font-medium tracking-wide text-bark/75 transition-all duration-300 hover:border-espresso/35 hover:text-espresso"
                      >
                        {s.label}
                        <ArrowUpRight size={13} />
                      </a>
                    ))}
                  </motion.div>
                </motion.div>
              </div>
            </div>
          </section>
        );
      }

      /* ------------------------------------------------------------------ */
      /*  FOOTER                                                             */
      /* ------------------------------------------------------------------ */

      function Footer() {
        return (
          <footer className="border-t border-espresso/10 bg-cream px-6 py-12 sm:px-8 lg:px-12">
            <div className="mx-auto flex max-w-7xl flex-col gap-8 sm:flex-row sm:items-center sm:justify-between">
              <div className="flex items-center gap-3">
                <span className="grid h-9 w-9 place-items-center rounded-full bg-espresso text-cream">
                  <Coffee size={16} />
                </span>
                <div>
                  <div className="font-display text-[1.05rem] font-semibold tracking-[-0.01em] text-espresso">
                    caffe Coffee Co.
                  </div>
                  <div className="text-[12px] text-bark/55">
                    Lagos, Nigeria · Est. 2016
                  </div>
                </div>
              </div>

              <nav className="flex flex-wrap gap-x-7 gap-y-3">
                {NAV_LINKS.map((l) => (
                  <a
                    key={l.href}
                    href={l.href}
                    className="text-[12.5px] font-medium text-bark/65 transition-colors hover:text-espresso"
                  >
                    {l.label}
                  </a>
                ))}
              </nav>

              <div className="text-[12px] text-bark/45">
                © {new Date().getFullYear()} caffe Coffee Co.
              </div>
            </div>
          </footer>
        );
      }

      /* ------------------------------------------------------------------ */
      /*  APP                                                                */
      /* ------------------------------------------------------------------ */

      function App() {
        useEffect(() => {
          const boot = document.getElementById("boot");
          if (boot) {
            requestAnimationFrame(() => {
              boot.classList.add("hide");
              setTimeout(() => boot.remove(), 600);
            });
          }
        }, []);

        return (
          <div className="min-h-screen bg-cream font-sans text-espresso antialiased">
            <ScrollBar />
            <Nav />
            <main>
              <Hero />
              <Story />
              <MenuSection />
              <Gallery />
              <Locations />
              <Contact />
            </main>
            <Footer />
          </div>
        );
      }

      const container = document.getElementById("root");
      createRoot(container).render(<App />);
    </script>
  </body>
</html>
